[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-lens"
version = "0.2.1"
description = "CLI-инструмент для анализа, визуализации и диагностики конфигураций Nginx"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Daniil Astrouski", email = "shelovesuastra@gmail.com"}
]
keywords = ["nginx", "cli", "audit", "visualization", "diagnostics", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.25.0"
]

[project.urls]
Homepage = "https://github.com/shelovesuastra/nginx-lens"
Documentation = "https://github.com/shelovesuastra/nginx-lens"
Source = "https://github.com/shelovesuastra/nginx-lens"
Issues = "https://github.com/shelovesuastra/nginx-lens/issues"

[project.scripts]
nginx-lens = "commands.cli:app"
